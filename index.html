<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propuesta Equipamiento Audiovisual - Biblioteca</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fcfaf8',
                            100: '#f7f3ef',
                            200: '#efe6dc',
                            300: '#e0cbb8',
                            500: '#a68a6d',
                            700: '#5c4d3c',
                            900: '#3d3228',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 300px;
            margin: 0 auto;
        }
        .product-card-active {
            border-left: 4px solid #a68a6d;
            background-color: #f7f3ef;
        }
        .img-container img {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 8px;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-brand-50 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-brand-900">🎥 Equipamiento Biblioteca</h1>
                <p class="text-sm text-gray-500">Kit Pro Actualizado (Action 5 Pro)</p>
            </div>
            <div class="mt-4 md:mt-0 text-right">
                <span class="block text-xs uppercase tracking-wide text-gray-400 font-semibold">Inversión Total</span>
                <span class="text-2xl font-bold text-brand-700" id="total-budget-display">$0.00 MXN</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full space-y-12">
        <!-- Explorador Interactivo -->
        <section>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <!-- Lista -->
                <div class="lg:col-span-4 flex flex-col space-y-3" id="product-list-container"></div>
                <!-- Detalle -->
                <div class="lg:col-span-8">
                    <div id="detail-panel" class="bg-white rounded-xl shadow-lg border border-brand-100 overflow-hidden h-full flex flex-col"></div>
                </div>
            </div>
        </section>

        <!-- Gráfico -->
        <section class="bg-white rounded-xl shadow-sm p-6 border border-brand-100">
            <h2 class="text-xl font-semibold text-brand-900 mb-6 text-center">Distribución del Presupuesto</h2>
            <div class="chart-container">
                <canvas id="budgetChart"></canvas>
            </div>
        </section>

        <!-- Tabla -->
        <section class="pb-12">
            <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-brand-100">
                <table class="w-full text-left text-sm">
                    <thead class="bg-brand-50 text-brand-900 uppercase font-bold text-xs">
                        <tr>
                            <th class="px-6 py-4">Producto</th>
                            <th class="px-6 py-4 text-right">Precio Unitario</th>
                            <th class="px-6 py-4 text-right">Enlace</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-brand-100" id="purchase-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const products = [
            {
                name: "DJI Osmo Action 5 Pro",
                category: "Cámara",
                price: 6310.85,
                icon: "📹",
                description: "Cámara insignia de DJI con sensor de 1/1.3 pulgadas y rango dinámico de 13.5 pasos. Ideal para grabaciones de alta calidad en cualquier condición de luz.",
                link: "https://www.amazon.com.mx/DJI-Osmo-Action-Pro-estabilizaci%C3%B3n/dp/B0D1YH4B2R/",
                image: "https://m.media-amazon.com/images/I/71EJztia1eL._AC_SL1500_.jpg",
                specs: ["Video 4K/120fps", "Pantallas OLED Duales", "47GB Memoria Interna", "Sensor de última generación"]
            },
            {
                name: "DJI Mic Mini (2 TX + 1 RX)",
                category: "Audio",
                price: 1809.00,
                icon: "🎙️",
                description: "Sistema inalámbrico ultraligero para un sonido profesional sin cables estorbosos.",
                link: "https://www.amazon.com.mx/DJI-superligero-cancelaci%C3%B3n-micr%C3%B3fono-inal%C3%A1mbrico/dp/B0DDL8WGH5/",
                image: "https://m.media-amazon.com/images/I/61l6NdcbuqL._AC_SX679_.jpg",
                specs: ["Cancelación de Ruido Activa", "48 kHz/24 bits", "Alcance hasta 40m", "Clip Magnético"]
            },
            {
                name: "Neewer Kit LED (2 Pack)",
                category: "Luz",
                price: 2159.00,
                icon: "💡",
                description: "Set de iluminación bicolor regulable esencial para evitar sombras en grabaciones interiores.",
                link: "https://www.amazon.com.mx/Neewer-Unidades-Bi-color-Regulable-Soporte/dp/B072Q42GXQ/",
                image: "https://m.media-amazon.com/images/I/71H5ba4afyL._AC_SX679_.jpg",
                specs: ["Temperatura 3200-5600K", "CRI 96+", "Soportes de 1.9m", "Maletín Incluido"]
            },
            {
                name: "Soporte Trípode DJI",
                category: "Soporte",
                price: 542.37,
                icon: "📐",
                description: "Soporte plegable original para máxima estabilidad en tomas de escritorio.",
                link: "https://www.amazon.com.mx/Osmo-Mobile-Soporte-tr%C3%ADpode-Mobile-Osmo-Pocket/dp/B0F8Q4MH8V/",
                image: "https://m.media-amazon.com/images/I/6173SxHrpsL._AC_SX679_.jpg",
                specs: ["Construcción en Aluminio", "Base Antideslizante", "Plegado Compacto", "Original DJI"]
            },
            {
                name: "SanDisk Extreme Pro 128GB",
                category: "Memoria",
                price: 1094.36,
                icon: "💾",
                description: "Tarjeta de alta velocidad indispensable para el flujo de datos del video 4K.",
                link: "https://www.amazon.com.mx/SanDisk-microSDXC-Adaptador-RescuePRO-Performance/dp/B09X7CRKRZ/",
                image: "https://m.media-amazon.com/images/I/71m6k4-j1fL._AC_SL1500_.jpg",
                specs: ["Hasta 200MB/s", "Clase V30 para Video", "Resistente a Rayos X", "Adaptador SD Incluido"]
            }
        ];

        let selectedIdx = 0;
        let chart = null;

        function format(num) {
            return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(num);
        }

        function updateUI() {
            const list = document.getElementById('product-list-container');
            const table = document.getElementById('purchase-table-body');
            let total = 0;

            list.innerHTML = '';
            table.innerHTML = '';

            products.forEach((p, i) => {
                total += p.price;
                
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-lg flex justify-between items-center transition-all ${i === selectedIdx ? 'product-card-active shadow-md' : 'bg-white border border-transparent'}`;
                btn.onclick = () => { selectedIdx = i; updateUI(); };
                btn.innerHTML = `<div><span class="text-xl mr-2">${p.icon}</span><span class="font-bold">${p.category}</span><p class="text-xs text-gray-500">${p.name.substring(0,25)}...</p></div><span class="font-bold text-brand-700">${format(p.price)}</span>`;
                list.appendChild(btn);

                const row = document.createElement('tr');
                row.innerHTML = `<td class="px-6 py-4 font-medium">${p.name}</td><td class="px-6 py-4 text-right font-bold text-brand-700">${format(p.price)}</td><td class="px-6 py-4 text-right text-blue-600 underline text-xs"><a href="${p.link}" target="_blank">Ver Amazon</a></td>`;
                table.appendChild(row);
            });

            document.getElementById('total-budget-display').innerText = format(total);
            renderDetail();
            renderChart();
        }

        function renderDetail() {
            const p = products[selectedIdx];
            const panel = document.getElementById('detail-panel');
            panel.innerHTML = `
                <div class="fade-in flex flex-col md:flex-row h-full">
                    <div class="md:w-1/2 p-6 bg-gray-50 flex items-center justify-center img-container">
                        <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x300?text=Imagen+no+disponible'">
                    </div>
                    <div class="md:w-1/2 p-8 flex flex-col justify-between">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-900">${p.name}</h2>
                            <p class="text-gray-500 mt-2 mb-6">${p.description}</p>
                            <ul class="space-y-2">
                                ${p.specs.map(s => `<li class="text-sm text-gray-600 flex items-center"><span class="w-2 h-2 bg-brand-500 rounded-full mr-2"></span>${s}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="mt-8 border-t pt-6">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-gray-400">Precio Amazon</span>
                                <span class="text-3xl font-bold text-brand-700">${format(p.price)}</span>
                            </div>
                            <a href="${p.link}" target="_blank" class="block w-full bg-brand-700 text-white text-center py-3 rounded-lg font-bold hover:bg-brand-900">Ir a la tienda</a>
                        </div>
                    </div>
                </div>`;
        }

        function renderChart() {
            const ctx = document.getElementById('budgetChart');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: products.map(p => p.category),
                    datasets: [{
                        data: products.map(p => p.price),
                        backgroundColor: ['#5c4d3c', '#a68a6d', '#e0cbb8', '#d1d5db', '#9ca3af']
                    }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        window.onload = updateUI;
    </script>
</body>
</html>
